services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vinculo
      POSTGRES_USER: vinculo
      POSTGRES_PASSWORD: vinculo
    ports:
      - "5437:5432"
    volumes:
      - vinculo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vinculo -d vinculo"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  vinculo-postgres-data:
